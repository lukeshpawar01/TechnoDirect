# Render Blueprint - TechnoDirect dashboard (one web service: Django API + built React frontend).
# Render -> New -> Blueprint -> pick this repo. Values marked "sync: false" are asked for once in Render's form
# (copy them from Backend/.env); no secret is stored in git. Guide: deploy/render/RENDER.md
services:
  - type: web
    name: technodirect-dashboard
    runtime: python
    plan: free            # sleeps after 15 min idle and has no disk - see RENDER.md; "starter" + a disk later
    region: singapore     # next to Supabase (ap-southeast-1) and to India
    rootDir: Backend
    buildCommand: >-
      pip install -r requirements.txt &&
      cd ../Frontend && npm ci && VITE_API_BASE_URL=/api npm run build
    startCommand: python serve.py
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      # --- fixed -------------------------------------------------------------------------------------------
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FRONTEND_DIST
        value: ../Frontend/dist
      - key: SERVE_THREADS
        value: "4"          # the free instance has 512 MB
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: SYNC_TIMES
        value: "10:30,15:30"
      - key: INVENTORY_PRIMARY_SOURCE
        value: td
      # --- Supabase: TD data (read-only login) and dashboard edits / fixed sheets (edits login) ------------
      - key: SUPABASE_DB_HOST
        value: aws-1-ap-southeast-1.pooler.supabase.com
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_SSLMODE
        value: require
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_EDITS_USER
        sync: false
      - key: SUPABASE_EDITS_PASSWORD
        sync: false
      # --- Google Sheets (live Tracker + TechnoD Distributors) ---------------------------------------------
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false         # paste the key file's whole JSON text (not a path)
      - key: SETTLEMENT_SHEET_URL
        sync: false
      - key: SETTLEMENT_SHEET_TAB
        value: Tracker
      - key: DISTRIBUTOR_SYNC_SHEET_URL
        sync: false
      - key: DISTRIBUTOR_SYNC_SHEET_TAB
        value: TechnoD Distributors
      - key: CRM_SHEET_URL
        sync: false
      - key: TARGETS_SHEET_URL
        sync: false
      - key: TARGETS_SHEET_TAB
        value: Monthly Tracker
      # --- Dropbox (BlueOrigin) ----------------------------------------------------------------------------
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_BO_PATH
        value: /Power BI
      # --- login / email / assistant -----------------------------------------------------------------------
      - key: MASTER_ADMIN_EMAIL
        sync: false
      - key: MASTER_ADMIN_PASSWORD
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ASSISTANT_ENABLED
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        sync: false
