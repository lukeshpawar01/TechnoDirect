# Local full stack: Postgres warehouse + Redis + API + Celery worker + Celery beat.
#   docker compose up --build
#   docker compose exec web python manage.py create_master_admin
#   docker compose exec web python manage.py seed_demo_data      # optional demo data
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://technodirect:technodirect@db:5432/technodirect
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: technodirect
      POSTGRES_USER: technodirect
      POSTGRES_PASSWORD: technodirect
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technodirect"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn technodirect.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A technodirect worker -l info --concurrency 2

  beat:
    <<: *app
    command: celery -A technodirect beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  pgdata:
